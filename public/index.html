<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOEIC 650 trong 35 ngày</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F7FB; --sheet:#FFFFFF; --ink:#1B2440; --muted:#5E6782; --line:#DCE1EC;
  --omr:#C8356A; --omr-soft:#FBE7EF; --pencil:#2B3145; --mark:#FFE58A; --good:#1F8A5B; --good-soft:#E3F4EC; --bad:#C43D3D; --bad-soft:#FBE9E9;
  --sans:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#11141D; --sheet:#181C28; --ink:#E7EAF3; --muted:#9AA3BD; --line:#2B3246;
  --omr:#F0719D; --omr-soft:#3A1E2B; --pencil:#D5DAE8; --mark:#5A4A10; --good:#4FC28E; --good-soft:#15352A; --bad:#F07C7C; --bad-soft:#3A1C1C; } }
:root[data-theme="dark"]{ --paper:#11141D; --sheet:#181C28; --ink:#E7EAF3; --muted:#9AA3BD; --line:#2B3246;
  --omr:#F0719D; --omr-soft:#3A1E2B; --pencil:#D5DAE8; --mark:#5A4A10; --good:#4FC28E; --good-soft:#15352A; --bad:#F07C7C; --bad-soft:#3A1C1C; }
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--sans);-webkit-text-size-adjust:100%}
.wrap{max-width:900px;margin:0 auto;padding:0 18px}
a{color:var(--omr)}
.en{font-family:var(--serif);font-size:1.06em}
.muted{color:var(--muted)} .small{font-size:.85em}
h2,h3,h4{line-height:1.25;margin:1.2em 0 .5em}
/* hero */
.hero{padding:34px 0 22px;border-bottom:1px solid var(--line);background:var(--sheet)}
.hero-top{display:flex;gap:24px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.hero h1{font-size:clamp(28px,5vw,44px);line-height:1.05;margin:0;font-weight:800;letter-spacing:-.02em}
.hero h1 small{display:block;font-size:.42em;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:10px}
.count{display:flex;gap:22px}
.count div{display:flex;flex-direction:column}
.count b{font-size:40px;line-height:1;font-weight:800;color:var(--omr);font-variant-numeric:tabular-nums}
.count span{font-size:13px;color:var(--muted)}
.sheet{margin-top:24px;border:1.5px solid var(--omr);border-radius:6px;padding:14px 14px 10px;background:var(--omr-soft)}
.sheet-h{display:flex;justify-content:space-between;font-size:13px;color:var(--omr);font-weight:600;margin-bottom:8px;gap:10px;flex-wrap:wrap}
#grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px 6px}
.bub{appearance:none;border:1.5px solid var(--omr);background:var(--sheet);color:var(--omr);border-radius:50%;aspect-ratio:1.45/1;width:100%;max-width:64px;justify-self:center;font:600 13px var(--sans);cursor:pointer;display:grid;place-items:center;padding:0;transition:transform .12s}
.bub:hover{transform:scale(1.06)}
.bub.t-fix{border-style:dashed}
.bub.t-test,.bub.t-final{border-width:2.5px}
.bub.t-test:not(.filled){background:var(--omr-soft)}
.bub.filled{background:var(--pencil);border-color:var(--pencil);color:var(--sheet)}
.bub.today{box-shadow:0 0 0 3px var(--sheet),0 0 0 5px var(--omr)}
.bub.sel{outline:2px solid var(--ink);outline-offset:3px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:18px;height:12px;border-radius:50%;border:1.5px solid var(--omr);vertical-align:-1px;margin-right:5px;background:var(--sheet)}
.legend i.f{background:var(--pencil);border-color:var(--pencil)} .legend i.d{border-style:dashed} .legend i.m{border-width:2.5px;background:var(--omr-soft)}
/* tabs */
#tabs{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;padding:0 max(18px,calc((100% - 900px)/2 + 18px));padding-top:env(safe-area-inset-top,0px);scrollbar-width:none}
#tabs button{appearance:none;border:0;background:none;color:var(--muted);font:600 14.5px var(--sans);padding:14px 12px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
#tabs button.on{color:var(--ink);border-bottom-color:var(--omr)}
#tabs em{font-style:normal;background:var(--omr);color:#fff;border-radius:10px;padding:0 6px;font-size:11px;margin-left:3px}
main{padding:10px 0 80px}
/* buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--sheet);color:var(--ink);font:600 14px var(--sans);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--ink)} .btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.btn.ghost{background:transparent}
.btn.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,.card:focus-visible{outline:2px solid var(--omr);outline-offset:2px}
/* day head */
.dayhead{padding:18px 0 6px}
.dnav{display:flex;gap:8px;flex-wrap:wrap}
.phase{margin:18px 0 0;color:var(--omr);font-weight:600;font-size:14px}
.dayhead h2{font-size:clamp(24px,4vw,32px);margin:.15em 0 .2em;font-weight:800;letter-spacing:-.01em}
.dnum{color:var(--omr)}
.lead{font-size:19px;font-weight:600;margin:0}
.checklist{list-style:none;padding:0;margin:18px 0 0;border:1px solid var(--line);border-radius:10px;background:var(--sheet);counter-reset:c}
.checklist li{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-top:1px solid var(--line);gap:10px}
.checklist li:first-child{border-top:0}
.checklist label{display:flex;gap:10px;align-items:center;cursor:pointer}
.checklist a{color:var(--ink);text-decoration:none} .checklist a:hover{text-decoration:underline}
.checklist input:checked + a{color:var(--muted);text-decoration:line-through}
.time{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=checkbox],input[type=radio]{accent-color:var(--omr);width:18px;height:18px}
/* sections */
.sec{margin-top:30px;padding-top:6px;border-top:2px solid var(--ink)}
.sech{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sech h3{margin:.6em 0 .4em;font-size:21px;flex:1 1 280px}
.donechk{font-size:14px;font-weight:600;display:flex;gap:6px;align-items:center;cursor:pointer}
.lesson{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:6px 18px 12px;overflow-x:auto}
.lesson h4{margin:1em 0 .3em} .lesson ul,.lesson ol{padding-left:20px}
.lesson table,.lesson table{border-collapse:collapse;width:100%;margin:10px 0;font-size:14.5px}
.lesson th,.lesson td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.lesson th{background:var(--paper)}
.tip{background:var(--mark);padding:10px 14px;border-radius:6px;margin:12px 0;color:var(--ink)}
ul.plain{padding-left:20px}
/* words */
.wlist{border:1px solid var(--line);border-radius:10px;background:var(--sheet)}
.wrow{display:flex;gap:12px;padding:10px 14px;border-top:1px solid var(--line);align-items:flex-start}
.wrow:first-child{border-top:0}
.wrow.known{background:var(--good-soft)}
.wmain{flex:1;min-width:0}
.ww{font-weight:600;font-size:1.15em}
.pos{color:var(--muted);font-size:13px;font-style:italic}
.wvi{font-weight:500}
.wex{color:var(--muted);font-size:.98em}
.say{appearance:none;border:1px solid var(--line);background:var(--paper);color:var(--omr);width:32px;height:32px;border-radius:50%;cursor:pointer;flex:none;font-size:11px}
.say.sm{width:24px;height:24px;font-size:9px;vertical-align:middle}
.kchk{font-size:13px;color:var(--muted);display:flex;gap:4px;align-items:center;white-space:nowrap;cursor:pointer}
/* flash */
.flash{margin:12px 0}
.card{background:var(--sheet);border:1.5px solid var(--ink);border-radius:14px;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;cursor:pointer;user-select:none}
.card.flipped{background:var(--omr-soft);border-color:var(--omr)}
.card .word{font-size:clamp(28px,6vw,40px);font-weight:600}
.card .vi{font-size:24px;font-weight:700}
.card .ex{margin-top:10px;color:var(--muted);max-width:560px}
.card .hint{margin-top:14px;font-size:12px;color:var(--muted)}
.fbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.fcount{text-align:center;font-size:13px;color:var(--muted);margin-top:6px}
/* quiz */
.qset{margin-top:10px}
.blk{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0}
.tag{font-size:12px;font-weight:700;color:var(--omr);margin-bottom:6px}
.scene{background:var(--paper);border-left:4px solid var(--omr);padding:10px 12px;margin-bottom:10px;border-radius:0 6px 6px 0}
.cam{display:inline-block;font-size:11px;font-weight:700;background:var(--omr);color:#fff;border-radius:4px;padding:1px 6px;margin-right:8px}
.passage{background:var(--paper);border:1px dashed var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;overflow-x:auto}
.passage h5{margin:0 0 6px;font-size:13px;color:var(--muted)}
.gap{display:inline-block;min-width:44px;border-bottom:2px solid var(--omr);text-align:center;font:700 12px var(--sans);color:var(--omr)}
.blank{display:inline-block;width:70px;border-bottom:2px solid var(--ink);margin:0 3px;vertical-align:baseline}
.play{appearance:none;border:0;background:var(--omr);color:#fff;font:700 14px var(--sans);padding:9px 16px;border-radius:30px;cursor:pointer;margin-bottom:6px}
.play.on{background:var(--ink);color:var(--sheet)}
fieldset.q{border:0;padding:0;margin:12px 0 0}
fieldset.q legend{padding:0;display:flex;gap:10px;align-items:baseline;width:100%}
.qn{flex:none;font:700 12px var(--sans);width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);display:inline-grid;place-items:center}
.opts{display:grid;gap:6px;margin:10px 0 0 36px}
.opt{position:relative;display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.opt:hover{border-color:var(--muted)}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt .L{flex:none;width:24px;height:18px;border-radius:50%;border:1.5px solid var(--omr);display:grid;place-items:center;font:700 11px var(--sans);color:var(--omr)}
.opt input:checked ~ .L{background:var(--pencil);border-color:var(--pencil);color:var(--sheet)}
.opt input:focus-visible ~ .L{outline:2px solid var(--omr);outline-offset:2px}
.ot.hid{color:transparent;background:repeating-linear-gradient(90deg,var(--line) 0 18px,transparent 18px 22px);border-radius:3px;min-width:120px;height:1em;margin-top:.25em}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.exp{margin:8px 0 0 36px;font-size:14.5px}
.g{color:var(--good)} .r{color:var(--bad)}
details.tr{margin-top:10px;font-size:15px}
details.tr summary{cursor:pointer;color:var(--omr);font-weight:600}
.qfoot{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:14px 0}
.rate{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted);margin:10px 0}
.rate input{vertical-align:middle;accent-color:var(--omr)}
.warn{color:var(--bad)}
.timer{display:flex;gap:12px;align-items:center;margin:10px 0}
.timer .tv{font:800 28px var(--sans);font-variant-numeric:tabular-nums}
.timer.over .tv{color:var(--bad)}
.estbox{border:2px solid var(--omr);border-radius:12px;padding:16px 18px;margin:24px 0;background:var(--omr-soft);display:grid;gap:8px}
.estbox .big{font-size:48px;font-weight:800;color:var(--omr);line-height:1;margin-right:10px}
.estbox p{margin:0}
/* plan */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:22px 0}
.stats div{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column}
.stats b{font-size:28px;line-height:1.1}
.stats span{font-size:13px;color:var(--muted)}
.bars{display:flex;gap:3px;align-items:flex-end;height:120px;border-bottom:1px solid var(--line);overflow-x:auto;padding-bottom:18px;position:relative}
.bar{flex:1 0 14px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;position:relative}
.bar i{display:block;background:var(--omr);border-radius:3px 3px 0 0;min-height:0}
.bar span{position:absolute;bottom:-17px;left:0;right:0;text-align:center;font-size:9px;color:var(--muted)}
.phaseblk{margin-top:28px}
ol.days{list-style:none;padding:0;margin:0;border:1px solid var(--line);border-radius:10px;background:var(--sheet)}
ol.days li{border-top:1px solid var(--line)} ol.days li:first-child{border-top:0}
ol.days button{appearance:none;border:0;background:none;color:inherit;font:inherit;text-align:left;width:100%;display:grid;grid-template-columns:44px 110px 1fr;gap:2px 10px;padding:10px 14px;cursor:pointer}
ol.days button:hover{background:var(--paper)}
.dn{grid-row:span 2;width:36px;height:26px;border-radius:50%;border:1.5px solid var(--omr);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--omr)}
li.done .dn{background:var(--pencil);border-color:var(--pencil);color:var(--sheet)}
li.t-fix .dn{border-style:dashed} li.t-test .dn{border-width:2.5px;background:var(--omr-soft)}
.dt{color:var(--muted);font-size:13px;grid-row:span 2}
.dm{font-weight:600} .ds{font-size:13px;color:var(--muted);grid-column:3}
/* library */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 10px}
.toolbar select,.toolbar input{font:15px var(--sans);padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink);flex:1 1 220px}
details.gl{background:var(--sheet);border:1px solid var(--line);border-radius:10px;margin:10px 0;padding:0 14px}
details.gl > summary{cursor:pointer;padding:12px 0;font-weight:600;display:flex;gap:10px;align-items:center;list-style:none}
details.gl > summary::-webkit-details-marker{display:none}
details.gl[open] > summary{border-bottom:1px solid var(--line);margin-bottom:10px}
.gi{flex:none;width:30px;height:22px;border-radius:50%;border:1.5px solid var(--omr);color:var(--omr);display:grid;place-items:center;font-size:12px}
details.gl .lesson{border:0;padding:0 0 8px}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
@media (max-width:560px){
  .hero{padding-top:22px} .count b{font-size:32px}
  #grid{gap:6px 4px} .bub{font-size:11px}
  .opts,.exp{margin-left:0} ol.days button{grid-template-columns:40px 1fr} .dt{grid-row:auto} .dm,.ds{grid-column:2}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;scroll-behavior:auto!important} }

/* tests & guide */
.parthead{margin:28px 0 8px;padding:12px 16px;border-radius:10px;background:var(--ink);color:var(--paper)}
.parthead h4{margin:0;display:inline-block;margin-right:10px}
.parthead .range{font:700 12px var(--sans);background:var(--omr);color:#fff;padding:2px 8px;border-radius:10px}
.parthead p{margin:6px 0 0;font-size:14px;opacity:.9} .parthead a{color:var(--mark)}
:root[data-theme="dark"] .parthead a{color:var(--omr)}
.graphic{margin:8px 0 10px;overflow-x:auto}
.graphic .gcap{font:700 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.graphic table,table.gt,table.ptab{border-collapse:collapse;font-size:14px;width:100%;max-width:560px}
.graphic th,.graphic td,table.gt th,table.gt td,table.ptab th,table.ptab td{border:1px solid var(--line);padding:5px 9px;text-align:left}
.graphic th,table.gt th,table.ptab th{background:var(--paper)}
table.gt{max-width:none;margin:10px 0}
.note3{display:inline-block;font:700 12px var(--sans);color:var(--omr);border:1px solid var(--omr);border-radius:10px;padding:1px 8px;margin-bottom:6px}
.passage .doc{margin:4px 0}
.passage .doc table{border-collapse:collapse;margin:8px 0;font-size:14px}
.passage .doc th,.passage .doc td{border:1px solid var(--line);padding:4px 8px;text-align:left}
.doclbl{font:700 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--omr);margin-top:14px;padding-top:10px;border-top:2px solid var(--line)}
.doclbl:first-child{border-top:0;margin-top:0;padding-top:0}
.ins{font:700 12px var(--sans);color:var(--omr);background:var(--omr-soft);padding:0 4px;border-radius:4px}
.blk.cur{border-color:var(--omr);box-shadow:0 0 0 3px var(--omr-soft)}
.examctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
.play.exam{font-size:15px;padding:10px 16px}
.play.mini{padding:4px 10px;font-size:12.5px}
.tintro{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:4px 16px;margin:12px 0}
table.ptab{margin:6px 0;max-width:none;background:var(--sheet)}
table.ptab .g{color:var(--good);font-weight:700}
table.hist tr.sel td{background:var(--omr-soft)}
.thead{margin-top:28px}
.tbars{height:150px}
.tbars span{white-space:nowrap}
.cheat li{margin:4px 0}
.lesson .ex{background:var(--paper);border-left:3px solid var(--good);padding:6px 12px;margin:8px 0;border-radius:0 6px 6px 0}
.rate{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.rate .once{display:inline-flex;gap:6px;align-items:center;font-weight:600;font-size:14px}
.play.used{background:var(--line);color:var(--muted);cursor:not-allowed}
#audiohelp{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:99;padding:16px}
#audiohelp[hidden]{display:none}
.ahbox{background:var(--sheet);color:var(--ink);max-width:520px;width:100%;border-radius:14px;padding:18px 20px;max-height:85vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.ahbox h4{margin:0 0 8px}.ahbox ul{padding-left:18px;margin:0 0 12px}.ahbox li{margin:6px 0;line-height:1.5}
.ahbtn{display:flex;gap:8px;justify-content:flex-end}
.btn.small{padding:4px 10px;font-size:13px}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <div class="hero-top">
    <h1>TOEIC 650 trong 35 ngày<small>Lộ trình 01/10 – 04/11 cho nền B1, thi ngày 06/11/2026 · bám sát xu hướng đề 2026 · 6 đề full 200 câu</small></h1>
    <div class="count"><div><b id="left">36</b><span>ngày đến kỳ thi</span></div><div><b id="donecount">0</b><span>ngày đã xong</span></div></div>
  </div>
  <div class="sheet">
    <div class="sheet-h"><span>Phiếu tiến độ: mỗi ô là một ngày, tô kín khi bạn hoàn thành</span><span>Tuần 1 → Tuần 5</span></div>
    <div id="grid"></div>
    <div class="legend"><span><i></i>Ngày học</span><span><i class="m"></i>Thi thử full 200 câu</span><span><i class="d"></i>Chữa đề</span><span><i class="f"></i>Đã hoàn thành</span></div>
  </div>
</div></header>
<nav id="tabs" aria-label="Mục"></nav>
<main class="wrap" id="view"></main>
<script>
const VOCAB = [
{t:"Office",vi:"Văn phòng & công việc hằng ngày",w:[
["supervisor","n","người giám sát, cấp trên","Please give the report to your supervisor."],
["colleague","n","đồng nghiệp","My colleague will cover my shift today."],

{t:"Từ loại & vị trí từ (Word forms)",c:`
<p>Đây là dạng câu hỏi chiếm khoảng 30–40% Part 5. Chỉ cần nhìn <b>vị trí chỗ trống</b> là chọn được đáp án mà không cần dịch cả câu.</p>
<h4>Dấu hiệu nhận biết đuôi từ</h4>
<table><tr><th>Loại từ</th><th>Đuôi thường gặp</th><th>Ví dụ</th></tr>
<tr><td>Danh từ (n)</td><td>-tion, -sion, -ment, -ness, -ity, -ance/-ence, -er/-or, -ee, -ist</td><td>information, agreement, ability, attendance, employee</td></tr>
<tr><td>Động từ (v)</td><td>-ize, -ify, -en, -ate</td><td>organize, notify, widen, generate</td></tr>
<tr><td>Tính từ (adj)</td><td>-ful, -less, -ive, -able/-ible, -al, -ous, -ic, -ent/-ant</td><td>useful, effective, available, financial, efficient</td></tr>
<tr><td>Trạng từ (adv)</td><td>adj + -ly</td><td>quickly, carefully, efficiently</td></tr></table>
<h4>Quy tắc vị trí</h4>
<ul><li>Sau mạo từ/tính từ sở hữu (a, the, his, their…) + ___ + giới từ → <b>danh từ</b>: <i>the <u>approval</u> of the board</i></li>
<li>Giữa mạo từ và danh từ → <b>tính từ</b>: <i>a <u>successful</u> campaign</i></li>
<li>Sau động từ to be / become / seem / remain → <b>tính từ</b>: <i>The staff were <u>helpful</u>.</i></li>
<li>Bổ nghĩa cho động từ, tính từ, cả câu → <b>trạng từ</b>: <i>work <u>efficiently</u>; <u>extremely</u> busy</i></li>
<li>Giữa trợ động từ và động từ chính → <b>trạng từ</b>: <i>has <u>recently</u> expanded; will <u>carefully</u> review</i></li>
<li>Sau chủ ngữ, chưa có động từ → <b>động từ</b> (chia đúng thì).</li></ul>
<div class="tip">Mẹo: Câu đã đủ thành phần (chủ ngữ + động từ + tân ngữ) mà vẫn còn chỗ trống → gần như chắc chắn là <b>trạng từ</b>.</div>`,

{t:"Thì hiện tại (Present tenses)",c:`
<h4>Hiện tại đơn — thói quen, sự thật, lịch trình</h4>
<p>S + V(s/es). Dấu hiệu: <b>every, usually, always, often, generally, each + time</b>. Lịch trình tàu xe, giờ mở cửa: <i>The store <u>opens</u> at 9 A.M.</i></p>
<h4>Hiện tại tiếp diễn — đang xảy ra, kế hoạch gần</h4>
<p>S + am/is/are + V-ing. Dấu hiệu: <b>now, currently, at the moment, right now, this week</b>. <i>We <u>are currently reviewing</u> applications.</i></p>
<h4>Hiện tại hoàn thành — kết quả đến hiện tại</h4>
<p>S + have/has + V3. Dấu hiệu: <b>since + mốc, for + khoảng, already, yet, recently, lately, so far, over the past (years)</b>.</p>
<p><i>Sales <u>have increased</u> <b>over the past</b> three months.</i></p>
<div class="tip">Mẹo TOEIC: Chủ ngữ số ít (The company, Each employee) → động từ thêm s/es hoặc has. "since 2020" → gần như luôn là have/has + V3.</div>`,

{t:"Thì quá khứ (Past tenses)",c:`
<h4>Quá khứ đơn</h4><p>S + V2/V-ed. Dấu hiệu: <b>yesterday, last (week/month/year), ago, in 2019, when + quá khứ</b>.</p>
<p><i>The company <u>hired</u> 20 new workers <b>last month</b>.</i></p>
<h4>Quá khứ tiếp diễn</h4><p>S + was/were + V-ing — hành động đang diễn ra thì hành động khác xen vào: <i>I <u>was preparing</u> the report when the power went out.</i></p>
<h4>Quá khứ hoàn thành</h4><p>S + had + V3 — xảy ra <b>trước</b> một hành động quá khứ khác. Dấu hiệu: <b>by the time + QKĐ, before + QKĐ, after</b>.</p>
<p><i><b>By the time</b> we arrived, the meeting <u>had</u> already <u>started</u>.</i></p>
<div class="tip">Phân biệt: "ago" → quá khứ đơn (không dùng HTHT). "since" → HTHT.</div>`,

["The package ___ yesterday, but no one was home.",["arrives","arrived","has arrived","arriving"],1,"'yesterday' → quá khứ đơn."],
["Before she joined our company, Ms. Kim ___ at a bank for five years.",["works","has worked","had worked","is working"],2,"Hành động xảy ra trước một hành động QK khác → QKHT."],
["The event ___ in 2015 and has been held every year since then.",["began","has begun","begins","begin"],0,"'in 2015' → quá khứ đơn."]]},
{t:"Thì tương lai & hoà hợp thì",c:`
<h4>Tương lai đơn</h4><p>S + will + V. Dấu hiệu: <b>tomorrow, next (week/month), soon, in the future, upcoming</b>.</p>
<h4>Be going to</h4><p>Kế hoạch đã dự định: <i>We <u>are going to</u> open a new store.</i></p>
<h4>Tương lai hoàn thành</h4><p>S + will have + V3. Dấu hiệu: <b>by + mốc tương lai</b>: <i>By next June, we <u>will have completed</u> the project.</i></p>
<h4>⚠️ Quy tắc quan trọng: mệnh đề thời gian</h4>
<p>Sau <b>when, before, after, as soon as, until, once, if</b> — dùng <b>hiện tại</b> thay cho tương lai.</p>
<p><i>Please call me <b>as soon as</b> the shipment <u>arrives</u>.</i> (KHÔNG dùng will arrive)</p>`,
q:[
["The new system ___ next Monday.",["installed","was installed","will be installed","installs"],2,"'next Monday' → tương lai; hệ thống được lắp → bị động."],
["Please contact me as soon as the report ___ ready.",["will be","is","was","being"],1,"Sau 'as soon as' dùng hiện tại thay tương lai."],
["By the end of this year, the company ___ 50 new stores.",["opens","opened","will have opened","has opened"],2,"'By the end of this year' → tương lai hoàn thành."],
["Mr. Ramos ___ the Singapore office next month.",["visited","has visited","will visit","visits"],2,"'next month' → tương lai đơn."],
["Once the renovation ___ , the lobby will reopen.",["completes","is completed","will be completed","completing"],1,"Sau 'once' dùng hiện tại; renovation được hoàn thành → bị động."],
["We ___ the results to all participants tomorrow.",["send","sent","will send","have sent"],2,"'tomorrow' → tương lai."],
["The seminar will start after everyone ___.",["arrives","will arrive","arrived","arriving"],0,"Sau 'after' trong câu tương lai → hiện tại đơn."]]},
{t:"Hoà hợp chủ ngữ – động từ",c:`
<ul><li>Chủ ngữ số ít / danh từ không đếm được → V(s/es), is, was, has.</li>
<li><b>Each / Every / Either / Neither + N số ít</b> → động từ số ít.</li>
<li><b>The number of + N số nhiều</b> → số ít. <b>A number of + N số nhiều</b> → số nhiều.</li>
<li>Chủ ngữ + cụm giới từ (of, with, in…) → chia theo <b>chủ ngữ chính</b>: <i>The list <s>of items</s> <u>is</u> on the desk.</i></li>
<li>Danh động từ (V-ing) làm chủ ngữ → số ít: <i>Reading reports <u>takes</u> time.</i></li>
<li>Danh từ không đếm được thường gặp: information, equipment, furniture, luggage, advice, machinery, merchandise → số ít.</li>
<li>Both A and B → số nhiều. Either A or B / Neither A nor B → chia theo B.</li></ul>`,
q:[
["Each of the applicants ___ required to submit two references.",["are","is","were","be"],1,"Each of + N → động từ số ít."],
["The number of visitors ___ increased this year.",["have","has","are","were"],1,"The number of → số ít."],
["A number of employees ___ volunteered for the project.",["has","have","is","was"],1,"A number of → số nhiều."],
["The equipment in the labs ___ checked every month.",["are","is","have","were"],1,"'equipment' không đếm được → số ít."],
["The results of the survey ___ very encouraging.",["was","is","were","has been"],2,"Chủ ngữ chính 'results' số nhiều."],
["Neither the manager nor the assistants ___ available today.",["is","was","are","has"],2,"Neither A nor B → chia theo B (assistants)."],
["Hiring qualified workers ___ a top priority for us.",["are","were","is","have"],2,"V-ing làm chủ ngữ → số ít."]]},
{t:"Câu bị động (Passive voice)",c:`
<p>Cấu trúc: <b>be + V3</b> (be chia theo thì). Dùng khi chủ ngữ <b>chịu tác động</b>.</p>
<table><tr><th>Thì</th><th>Bị động</th></tr>
<tr><td>Hiện tại đơn</td><td>am/is/are + V3</td></tr><tr><td>Quá khứ đơn</td><td>was/were + V3</td></tr>
<tr><td>HTHT</td><td>have/has been + V3</td></tr><tr><td>Tương lai</td><td>will be + V3</td></tr>
<tr><td>Tiếp diễn</td><td>am/is/are being + V3</td></tr><tr><td>Modal</td><td>can/must/should be + V3</td></tr></table>
<div class="tip">Mẹo cực nhanh: Sau chỗ trống <b>không có tân ngữ</b> (ngay sau là giới từ, dấu chấm, trạng từ) và chủ ngữ là vật → bị động. <br><i>The meeting <u>was postponed</u> until Friday.</i></div>
<p>Cụm bị động hay gặp: be located in, be scheduled for/to, be required to, be expected to, be pleased to, be designed to, be entitled to.</p>`,
q:[
["The conference room ___ for the training session tomorrow.",["reserves","has reserved","will be reserved","reserving"],2,"Phòng được đặt → bị động, tương lai."],
["All reports must ___ by Friday.",["submit","submitted","be submitted","submitting"],2,"Modal + be + V3."],
["The factory ___ in the northern part of the city.",["locates","is located","locating","has located"],1,"be located in = nằm ở."],
["The new software is currently ___ by our IT team.",["test","tested","being tested","testing"],2,"Bị động tiếp diễn: is being + V3."],
["Over 300 people ___ to the grand opening last week.",["invited","were invited","have invited","invite"],1,"Người được mời, 'last week' → was/were + V3."],
["The shipment has ___ due to bad weather.",["delay","delaying","been delayed","delayed"],2,"HTHT bị động: has been + V3."],
["Employees are ___ to wear safety helmets on site.",["require","requiring","required","requirement"],2,"be required to V."]]},
{t:"Danh động từ & động từ nguyên mẫu",c:`
<h4>Động từ + V-ing</h4><p>avoid, consider, recommend, suggest, enjoy, finish, mind, postpone, delay, keep, deny, include, discontinue</p>
<h4>Động từ + to V</h4><p>want, plan, decide, hope, agree, offer, refuse, promise, expect, afford, fail, intend, aim, strive, seek</p>
<h4>Giới từ + V-ing</h4><p><i>interested <b>in</b> joining, <b>before</b> leaving, <b>by</b> using, <b>without</b> asking, look forward <b>to</b> meeting, be committed <b>to</b> providing, be dedicated <b>to</b> improving</i></p>
<div class="tip">Bẫy: <b>look forward to / be committed to / be dedicated to / be used to</b> — "to" là giới từ → theo sau là V-ing.</div>
<h4>Mục đích</h4><p><b>to V / in order to V</b> = để: <i><u>To register</u>, visit our website.</i></p>`,
q:[
["We look forward to ___ you at the conference.",["see","seeing","seen","be seen"],1,"look forward to + V-ing."],
["The company decided ___ its headquarters to Hanoi.",["move","moving","to move","moved"],2,"decide + to V."],
["Please avoid ___ the elevator during the fire drill.",["use","to use","using","used"],2,"avoid + V-ing."],
["___ a refund, please bring your receipt.",["Receive","To receive","Received","Receiving"],1,"To V đầu câu = để (mục đích)."],
["Mr. Park is interested in ___ the marketing team.",["join","to join","joining","joined"],2,"Giới từ 'in' + V-ing."],
["We are committed to ___ high-quality products.",["provide","providing","provided","provision"],1,"be committed to + V-ing."],
["The manager agreed ___ the deadline by one week.",["extending","extend","to extend","extended"],2,"agree + to V."]]},
{t:"Phân từ: V-ing và V-ed",c:`
<h4>Tính từ phân từ</h4>
<ul><li><b>V-ing</b>: mang tính chủ động/gây ra cảm xúc — <i>an <u>exciting</u> offer, <u>rising</u> costs, the <u>following</u> items</i></li>
<li><b>V-ed</b>: bị động/cảm nhận — <i>an <u>experienced</u> engineer, <u>attached</u> file, <u>qualified</u> staff, <u>interested</u> customers</i></li></ul>
<h4>Rút gọn mệnh đề quan hệ</h4>
<p><i>Visitors <u>wishing</u> to attend…</i> (= who wish) — chủ động → V-ing.<br>
<i>The report <u>submitted</u> yesterday…</i> (= which was submitted) — bị động → V-ed.</p>
<h4>Rút gọn trạng ngữ</h4><p><i><b>When</b> <u>using</u> the machine, wear gloves.</i> / <i><b>Once</b> <u>approved</u>, the plan will be announced.</i></p>
<div class="tip">Cụm hay gặp: enclosed/attached document, detailed information, limited time, experienced staff, preferred method, rising demand, existing customers, remaining tickets.</div>`,
q:[
["Please review the ___ document before the meeting.",["attach","attaching","attached","attachment"],2,"Tài liệu 'được' đính kèm → V-ed."],
["Customers ___ to return an item must show the receipt.",["wish","wishing","wished","wishes"],1,"Rút gọn 'who wish' → V-ing."],
["We need an ___ technician to repair the system.",["experience","experiencing","experienced","experiences"],2,"experienced = có kinh nghiệm."],
["The ___ costs of materials have affected our profits.",["rise","rising","risen","rose"],1,"Chi phí đang tăng → V-ing (chủ động)."],
["The products ___ in this factory are sold worldwide.",["make","making","made","makes"],2,"Sản phẩm được làm → V-ed."],
["When ___ the form, please use black ink.",["complete","completing","completed","completion"],1,"When + V-ing (chủ ngữ người hoàn thành)."],
["The results were very ___ for the whole team.",["encourage","encouraged","encouraging","encouragement"],2,"Kết quả gây ra sự khích lệ → V-ing."]]},
{t:"Mệnh đề quan hệ",c:`
<table><tr><th>Đại từ</th><th>Thay cho</th><th>Ví dụ</th></tr>
<tr><td>who</td><td>người (chủ ngữ)</td><td>the woman <u>who</u> manages the store</td></tr>
<tr><td>whom</td><td>người (tân ngữ)</td><td>the person <u>whom</u> you met</td></tr>
<tr><td>which</td><td>vật</td><td>the report <u>which</u> was sent</td></tr>
<tr><td>that</td><td>người/vật (không sau dấu phẩy, không sau giới từ)</td><td>the car <u>that</u> I bought</td></tr>
<tr><td>whose</td><td>sở hữu (+ danh từ)</td><td>the client <u>whose</u> order was late</td></tr>
<tr><td>where / when</td><td>nơi chốn / thời gian</td><td>the city <u>where</u> we met</td></tr></table>
<div class="tip">Mẹo: Sau chỗ trống là <b>danh từ không có mạo từ</b> → <b>whose</b>. Sau chỗ trống là <b>động từ</b> → who/which. Có dấu phẩy trước → không dùng that. Giới từ + <b>which/whom</b>.</div>`,
q:[
["The employee ___ won the award has worked here for 10 years.",["which","who","whose","whom"],1,"Chỉ người, làm chủ ngữ → who."],
["We contacted the customer ___ order was delayed.",["who","which","whose","that"],2,"Sau là danh từ 'order' → whose."],
["The hotel ___ we stayed was near the beach.",["which","where","who","when"],1,"Nơi chốn → where."],
["The new model, ___ was released in May, is selling well.",["that","which","who","whose"],1,"Sau dấu phẩy, chỉ vật → which."],
["The manager to ___ you should send the form is Mr. Brown.",["who","whom","which","that"],1,"Giới từ + whom (người)."],
["The printer ___ we bought last month is already broken.",["who","whose","that","where"],2,"Chỉ vật, không dấu phẩy → that/which."],
["Applicants ___ résumés are incomplete will not be considered.",["who","whose","which","whom"],1,"+ danh từ 'résumés' → whose."]]},
{t:"Câu điều kiện",c:`
<table><tr><th>Loại</th><th>Mệnh đề If</th><th>Mệnh đề chính</th></tr>
<tr><td>0 – sự thật</td><td>If + hiện tại</td><td>hiện tại</td></tr>
<tr><td>1 – có thể xảy ra</td><td>If + hiện tại đơn</td><td>will / can / may + V; hoặc câu mệnh lệnh</td></tr>
<tr><td>2 – không thật ở hiện tại</td><td>If + quá khứ (were)</td><td>would / could + V</td></tr>
<tr><td>3 – không thật ở quá khứ</td><td>If + had V3</td><td>would have + V3</td></tr></table>
<h4>Đảo ngữ (hay gặp TOEIC)</h4>
<p><b>Should</b> you have any questions, please call us. (= If you have)<br>
<b>Had</b> we known, we would have come. (= If we had known)</p>
<p><b>Unless</b> = If … not. <b>Provided that / As long as</b> = miễn là.</p>`,
q:[
["If you ___ any questions, please contact our office.",["had","have","will have","having"],1,"Loại 1: If + hiện tại, mệnh lệnh."],
["___ you need further information, please call 555-0123.",["Should","Would","Had","Were"],0,"Đảo ngữ loại 1: Should + S + V."],
["If the weather ___ bad, the picnic will be canceled.",["is","will be","was","were"],0,"Loại 1: If + hiện tại đơn."],
["If we had left earlier, we ___ the train.",["will catch","would catch","would have caught","caught"],2,"Loại 3."],
["___ the order is received by noon, it will ship today.",["Unless","Provided that","Although","Despite"],1,"Provided that = miễn là (hợp nghĩa)."],
["If I ___ you, I would accept the offer.",["am","was being","were","be"],2,"Loại 2: If I were you."],
["The event will be held outdoors ___ it rains.",["if","unless","because","so"],1,"Tổ chức ngoài trời trừ khi trời mưa → unless."]]},
{t:"Giới từ (thời gian, nơi chốn, cụm cố định)",c:`
<h4>Thời gian</h4><ul><li><b>at</b> + giờ: at 9 A.M., at noon</li><li><b>on</b> + ngày/thứ: on Monday, on May 5</li><li><b>in</b> + tháng/năm/mùa: in June, in 2025</li>
<li><b>by</b> + mốc = trước/không muộn hơn: by Friday. <b>until</b> = kéo dài đến: open until 9 P.M.</li>
<li><b>for</b> + khoảng thời gian; <b>during</b> + danh từ sự kiện: during the meeting; <b>within</b> = trong vòng: within 3 days</li></ul>
<h4>Nơi chốn</h4><p>at the front desk, in the lobby, on the second floor, next to, across from, along the road, throughout the building</p>
<h4>Cụm cố định hay gặp</h4><p>in charge of, in addition to, according to, due to/because of (+N), instead of, in response to, on behalf of, prior to (= before), regardless of, in accordance with, on time, in time, out of order, under construction</p>`,
q:[
["The store is open ___ 9 A.M. to 6 P.M.",["at","from","in","on"],1,"from … to …"],
["Please return the form ___ Friday.",["until","by","during","in"],1,"Hạn chót → by."],
["No phone calls are allowed ___ the presentation.",["while","during","for","at"],1,"during + danh từ."],
["The flight was canceled ___ bad weather.",["because","due to","although","so"],1,"due to + danh từ."],
["Mr. Ahmed spoke ___ behalf of the company.",["in","at","on","by"],2,"on behalf of."],
["The package will arrive ___ three business days.",["within","since","between","among"],0,"within = trong vòng."],
["The elevator is out ___ order.",["from","in","of","on"],2,"out of order = hỏng."]]},
{t:"Liên từ & từ nối",c:`
<table><tr><th>Ý nghĩa</th><th>+ Mệnh đề (S+V)</th><th>+ Danh từ/V-ing</th><th>Trạng từ nối (; / . ___,)</th></tr>
<tr><td>Nguyên nhân</td><td>because, since, as</td><td>because of, due to, owing to</td><td>therefore, as a result, consequently</td></tr>
<tr><td>Nhượng bộ</td><td>although, even though, though</td><td>despite, in spite of</td><td>however, nevertheless</td></tr>
<tr><td>Thời gian</td><td>when, while, before, after, until, once</td><td>during, prior to</td><td>meanwhile, afterward</td></tr>
<tr><td>Thêm ý</td><td>and</td><td>in addition to, besides</td><td>in addition, moreover, furthermore</td></tr>
<tr><td>Điều kiện</td><td>if, unless, as long as</td><td>in case of</td><td>otherwise</td></tr></table>
<div class="tip">Quy trình 2 bước: (1) Sau chỗ trống là mệnh đề hay danh từ? (2) Chọn theo nghĩa. Đây là dạng xuất hiện rất nhiều trong Part 5 & 6.</div>`,
q:[
["___ the heavy rain, the event was a great success.",["Although","Despite","Because","However"],1,"+ danh từ, nghĩa tương phản → Despite."],
["___ sales were low, the company made a profit.",["Despite","Even though","Due to","Therefore"],1,"+ mệnh đề, tương phản → Even though."],
["The road is closed; ___, you should take a detour.",["therefore","although","because","despite"],0,"Trạng từ nối chỉ kết quả."],
["The meeting was postponed ___ the manager was sick.",["because of","because","despite","so"],1,"+ mệnh đề, nguyên nhân → because."],
["___ the conference, participants can visit the booths.",["While","During","When","Although"],1,"+ danh từ → During."],
["Please turn off the lights ___ you leave.",["before","during","despite","prior"],0,"+ mệnh đề, thời gian → before."],
["The hotel is expensive. ___, it is always fully booked.",["However","Because","Despite","Unless"],0,"Hai câu tương phản, đứng đầu câu có dấu phẩy → However."]]},
{t:"Đại từ (Pronouns)",c:`
<table><tr><th>Chủ ngữ</th><th>Tân ngữ</th><th>Tính từ sở hữu</th><th>Đại từ sở hữu</th><th>Phản thân</th></tr>
<tr><td>I</td><td>me</td><td>my</td><td>mine</td><td>myself</td></tr><tr><td>you</td><td>you</td><td>your</td><td>yours</td><td>yourself</td></tr>
<tr><td>he / she</td><td>him / her</td><td>his / her</td><td>his / hers</td><td>himself / herself</td></tr>
<tr><td>it</td><td>it</td><td>its</td><td>—</td><td>itself</td></tr><tr><td>we</td><td>us</td><td>our</td><td>ours</td><td>ourselves</td></tr>
<tr><td>they</td><td>them</td><td>their</td><td>theirs</td><td>themselves</td></tr></table>
<ul><li>Trước danh từ → <b>tính từ sở hữu</b>: <i>their products</i></li><li>Sau động từ/giới từ → <b>tân ngữ</b>: <i>send them</i></li>
<li>Đứng một mình thay cho "tính từ sở hữu + N" → <b>đại từ sở hữu</b>: <i>Your plan is better than <u>ours</u>.</i></li>
<li><b>by + oneself</b> = một mình; phản thân nhấn mạnh: <i>The CEO <u>herself</u> answered.</i></li>
<li><b>Those who</b> = những người mà: <i>Those who register early get a discount.</i></li></ul>`,
q:[
["Ms. Kim finished the report by ___.",["she","her","hers","herself"],3,"by + oneself = tự mình."],
["The company will announce ___ new products next week.",["it","its","it's","itself"],1,"Trước danh từ → tính từ sở hữu 'its'."],
["Please send ___ your comments by e-mail.",["we","our","us","ours"],2,"Sau động từ → tân ngữ."],
["Our prices are lower than ___.",["they","their","theirs","them"],2,"Thay cho 'their prices' → theirs."],
["___ who wish to attend should register online.",["They","Those","These","Them"],1,"Those who = những ai."],
["Mr. Davis and ___ will lead the workshop.",["I","me","my","mine"],0,"Chủ ngữ → I."],
["The manager ___ reviewed every application.",["him","his","himself","he"],2,"Đại từ phản thân nhấn mạnh."]]},
{t:"So sánh (Comparisons)",c:`
<ul><li><b>So sánh bằng</b>: as + adj/adv + as — <i>as soon as possible</i></li>
<li><b>So sánh hơn</b>: adj-er / more + adj + <b>than</b> — dấu hiệu: <b>than</b>, <b>much/far/even/a lot</b> + so sánh hơn</li>
<li><b>So sánh nhất</b>: the + adj-est / the most + adj — dấu hiệu: <b>the</b>, <b>of all, in the region, ever</b>, one of the + N số nhiều</li>
<li><b>Càng… càng</b>: The + so sánh hơn…, the + so sánh hơn…</li></ul>
<p>Bất quy tắc: good/well → better → best; bad → worse → worst; many/much → more → most; little → less → least; far → farther/further.</p>`,
q:[
["This year's sales were much ___ than last year's.",["high","higher","highest","more high"],1,"much + so sánh hơn + than."],
["It is one of the ___ hotels in the city.",["large","larger","largest","most large"],2,"one of the + so sánh nhất."],
["Please reply as ___ as possible.",["quick","quickly","quicker","quickest"],1,"as + adv + as (bổ nghĩa cho reply)."],
["The new printer is ___ efficient than the old one.",["much","more","most","very"],1,"more + adj dài + than."],
["The ___ you practice, the better your score will be.",["much","most","more","many"],2,"The more…, the better…"],
["This is the ___ proposal we have ever received.",["good","better","best","well"],2,"the + best + ever."],

{t:"Trạng từ đặc biệt & từ chỉ số lượng",c:`
<h4>Trạng từ dễ nhầm</h4><ul><li><b>hard</b> (chăm chỉ) ≠ <b>hardly</b> (hầu như không); <b>late</b> (muộn) ≠ <b>lately</b> (gần đây)</li>
<li><b>already</b> (câu khẳng định) / <b>yet</b> (phủ định, nghi vấn) / <b>still</b> (vẫn)</li>
<li><b>almost</b> + all/every/always; <b>nearly</b>; <b>approximately</b> + con số</li><li><b>so</b> + adj + that; <b>such</b> + (a) + adj + N + that; <b>too</b> + adj + to V; adj + <b>enough</b></li></ul>
<h4>Từ chỉ số lượng</h4><table><tr><th>+ N đếm được số nhiều</th><th>+ N không đếm được</th><th>+ N số ít</th></tr>
<tr><td>many, (a) few, several, a number of, various, numerous, both</td><td>much, (a) little, a great deal of, a large amount of</td><td>each, every, another, either</td></tr></table>
<p>Cả hai: some, any, a lot of, all, most, plenty of. <b>Most</b> + N / <b>most of the</b> + N.</p>`,
q:[
["Several ___ were interviewed for the position.",["candidate","candidates","candidacy","candidate's"],1,"several + N số nhiều."],
["There is ___ information about the event on our website.",["many","a few","a lot of","several"],2,"information không đếm được → a lot of."],
["The instructions were ___ confusing that nobody understood them.",["such","so","too","very"],1,"so + adj + that."],
["Mr. Singh has ___ finished the project.",["yet","already","still","ever"],1,"Câu khẳng định → already."],
["___ employee must attend the safety training.",["All","Every","Many","Several"],1,"Every + N số ít."],
["We have ___ time left, so we must hurry.",["few","little","many","a few"],1,"time không đếm được, nghĩa phủ định → little."],
["The package was ___ heavy to carry by hand.",["so","such","too","enough"],2,"too + adj + to V."]]},
{t:"Mạo từ, danh từ đếm được & cụm danh từ",c:`
<ul><li>Danh từ đếm được số ít <b>luôn cần</b> a/an/the/my… đứng trước. Thấy danh từ số ít trơ trọi → câu sai hoặc cần chọn mạo từ/sở hữu.</li>
<li>Không đếm được (information, advice, equipment, furniture, luggage, baggage, merchandise, feedback, research, access, permission) → không có "a" và không thêm "s".</li>
<li><b>Danh từ ghép</b>: N + N — <i>safety regulations, customer satisfaction, application form, sales representative, employee performance</i>. Danh từ đầu thường ở dạng số ít.</li>
<li><b>Danh từ chỉ người vs vật</b>: applicant/application, attendee/attendance, employee/employment, participant/participation, supervisor/supervision → chọn theo nghĩa và mạo từ (an applicant, the application).</li></ul>`,

{t:"Thể sai khiến, giả định & cấu trúc đặc biệt",c:`
<h4>Thể sai khiến (Causative)</h4>
<ul><li><b>have</b> + người + V / <b>have</b> + vật + V3: <i>I had the technician <u>fix</u> it. / I had my car <u>repaired</u>.</i></li>
<li><b>get</b> + người + to V / get + vật + V3</li><li><b>make</b> + người + V; <b>let</b> + người + V; <b>help</b> + (người) + (to) V</li></ul>
<h4>Giả định (Subjunctive)</h4>
<p>suggest / recommend / request / require / insist / ask + <b>that</b> + S + <b>V nguyên mẫu</b> (không chia):</p>
<p><i>The manager requested that every employee <u>submit</u> the form.</i><br><i>It is important/essential/necessary that he <u>be</u> on time.</i></p>
<h4>Động từ + tân ngữ + to V</h4><p>ask, allow, encourage, require, remind, advise, enable, invite, expect + O + to V: <i>We encourage staff <u>to use</u> public transportation.</i></p>`,

["The new software will enable users ___ files faster.",["access","to access","accessing","accessed"],1,"enable + O + to V."],
["The supervisor let us ___ early on Friday.",["leave","to leave","leaving","left"],0,"let + O + V nguyên mẫu."]]},
{t:"Đảo ngữ & liên từ cặp",c:`
<h4>Liên từ cặp (rất hay gặp Part 5)</h4><ul>
<li><b>both</b> A <b>and</b> B</li><li><b>either</b> A <b>or</b> B</li><li><b>neither</b> A <b>nor</b> B</li>
<li><b>not only</b> A <b>but (also)</b> B</li><li><b>whether</b> A <b>or</b> B / whether or not</li><li><b>between</b> A <b>and</b> B</li></ul>
<div class="tip">Mẹo: Nhìn thấy một nửa cặp → chọn nửa còn lại ngay. "neither" → nor; "either" → or; "not only" → but also.</div>
<h4>Đảo ngữ</h4><ul><li><b>Only after / Only when / Not until</b> … + trợ động từ + S + V</li>
<li><b>Rarely / Seldom / Never / Hardly</b> + trợ động từ + S + V: <i>Rarely <u>does</u> the store offer such discounts.</i></li>
<li><b>Enclosed / Attached</b> + is/are + N: <i>Enclosed <u>is</u> a copy of the invoice.</i></li></ul>`,

{t:"Chiến lược Part 7: đọc lướt và tìm thông tin",c:`
<p>Part 7 có 54 câu và là phần quyết định điểm Reading. Hãy dành <b>50–55 phút</b> cho phần này.</p>
<ol><li><b>Đọc câu hỏi trước</b> (không đọc đáp án), gạch từ khóa: tên riêng, con số, ngày tháng.</li>
<li>Đọc lướt tiêu đề và câu đầu mỗi đoạn để biết bài nói về gì (câu hỏi "What is the purpose…" thường nằm ở đầu).</li>
<li>Tìm (scan) từ khóa trong bài. Đáp án đúng thường là <b>cách diễn đạt lại (paraphrase)</b> chứ không lặp y nguyên từ trong bài.</li>
<li>Làm đoạn đơn ngắn trước, đoạn kép/đoạn ba sau nếu thời gian gấp.</li></ol>

{t:"Part 7: câu hỏi NOT, suy luận và ý định câu nói",c:`

<li><b>Suy luận</b> ("What is suggested / implied / most likely…"): đáp án không có sẵn nguyên văn nhưng phải có căn cứ trong bài. Đừng suy diễn quá xa.</li>

<tr><td>Trích đoạn họp (meeting excerpt)</td><td>Chủ đề, vấn đề, kế hoạch tiếp theo</td><td>Sau "However/But" là vấn đề</td></tr>
<tr><td>Bản tin, giới thiệu diễn giả</td><td>Sự kiện gì, diễn giả nói về gì, sau đó làm gì</td><td>Theo thứ tự thời gian</td></tr></table>
<h4>Cách làm từng bước</h4><ol>
<li>Đọc trước 3 câu hỏi; câu đầu thường cho biết <b>loại bài</b> ("Who most likely is the speaker?").</li>
<li>Nghe câu mở đầu thật kỹ: nó trả lời câu 1 gần như mọi lần.</li>
<li>Theo sát thứ tự 3 câu hỏi, chọn ngay khi nghe thấy ý tương đương.</li>
<li>Câu cuối thường về <b>tương lai / yêu cầu</b>: chú ý đoạn kết.</li></ol>
<h4>Ví dụ phân tích câu hàm ý</h4><div class="ex"><p>"…every item must be scanned before it's put on the shelves. <b>I know, it adds a step.</b> But it will save us hours when we do the monthly count."<br>What does the speaker mean when she says, "I know, it adds a step"?<br>→ <b>She understands the process takes more work.</b> (thừa nhận bất tiện, rồi thuyết phục bằng "But…")</p></div>
<h4>Xu hướng 2026</h4><ul class="plain"><li>Bài nói hay dùng giọng Anh/Úc, tốc độ không nhanh hơn nhưng <b>paraphrase nhiều hơn</b>: "free dishwasher" → "a free <b>appliance</b>"; "donations from local businesses" → "partly by <b>business donations</b>".</li><li>Câu biểu đồ thường là lịch, sơ đồ tầng, danh sách giá, dự báo thời tiết.</li></ul>
<h4>Mục tiêu cho 600–650</h4><p>18–21/30.</p>`},

{p:"Part 5", t:"Điền từ vào câu (30 câu)", c:`
<h4>Đề cho gì</h4><p>30 câu, mỗi câu 1 chỗ trống và 4 lựa chọn. Kiểm tra 3 thứ: <b>từ loại</b>, <b>ngữ pháp</b>, <b>từ vựng/collocation</b>.</p>
<h4>Cách làm từng bước (≤ 20–30 giây/câu)</h4><ol>
<li><b>Nhìn 4 đáp án trước.</b> Xác định dạng câu:
<ul class="plain"><li>Cùng gốc từ, khác đuôi (success / succeed / successful / successfully) → <b>câu từ loại</b>: chỉ cần nhìn quanh chỗ trống.</li><li>Cùng động từ, khác thì/dạng → <b>câu ngữ pháp</b>: tìm chủ ngữ, dấu hiệu thời gian, chủ động/bị động.</li><li>4 từ khác nghĩa → <b>câu từ vựng</b>: phải đọc cả câu.</li><li>Giới từ / liên từ → xem sau chỗ trống là <b>danh từ</b> (giới từ) hay <b>mệnh đề</b> (liên từ).</li></ul></li>
<li>Câu từ loại: nhìn 2–3 từ trước và sau chỗ trống, áp quy tắc (xem bảng dưới). Chọn và đi tiếp, <b>không dịch cả câu</b>.</li>
<li>Câu từ vựng: đọc cả câu, loại đáp án không hợp nghĩa hoặc không đi với giới từ phía sau.</li>
<li>Không chắc thì đoán và đánh dấu, không bao giờ để trống.</li></ol>
<h4>Bảng quy tắc từ loại nhanh</h4><table class="gt"><tr><th>Vị trí chỗ trống</th><th>Cần</th><th>Ví dụ</th></tr>
<tr><td>a/an/the/my/its + ___ + danh từ</td><td>Tính từ</td><td>a <b>complimentary</b> shuttle</td></tr>
<tr><td>a/the/their + ___ (+ of / giới từ)</td><td>Danh từ</td><td>their <b>contributions</b> to</td></tr>
<tr><td>be / has been + ___ + V3</td><td>Trạng từ</td><td>has been <b>carefully</b> selected</td></tr>
<tr><td>V (+ tân ngữ) + ___</td><td>Trạng từ</td><td>rose <b>sharply</b></td></tr>
<tr><td>be / become / seem + ___</td><td>Tính từ</td><td>is more <b>convenient</b></td></tr>
<tr><td>Giới từ + ___ + tân ngữ</td><td>V-ing</td><td>before <b>operating</b> the machine</td></tr>
<tr><td>will / can / must / to + ___</td><td>V nguyên mẫu</td><td>will <b>introduce</b></td></tr></table>
<h4>Xu hướng 2026: collocation và từ vựng</h4><p>Nhiều câu Part 5 giờ có 4 đáp án cùng từ loại, phải biết <b>cụm từ cố định</b>. Học theo cụm, không học từ lẻ:</p>
<p class="en">meet the needs · at full capacity · go into effect · be responsible for · refrain from · comply with · in charge of · prior to · on behalf of · at no charge · around the clock · under the new policy · be eligible for · be committed to + V-ing · look forward to + V-ing · in case · as soon as possible</p>
<h4>Bẫy thường gặp</h4><ul class="plain"><li><b>Despite / Although:</b> Despite + danh từ; Although + mệnh đề.</li><li><b>During / While:</b> During + danh từ; While + mệnh đề.</li><li><b>Each / Every + danh từ số ít</b>; <b>Any / Few + số nhiều</b>.</li><li>Đại từ: their (trước danh từ) · them (tân ngữ) · theirs (đứng một mình) · themselves (phản thân).</li><li>Câu giả định: suggest / ask / require that + S + <b>V nguyên mẫu</b> (be handed).</li></ul>
<h4>Mục tiêu cho 600–650</h4><p>20–23/30 trong <b>≤ 12 phút</b>.</p>`},

{p:"Part 6", t:"Hoàn thành đoạn văn (16 câu / 4 đoạn)", c:`
<h4>Đề cho gì</h4><p>4 đoạn văn (e-mail, thông báo, bài báo, bản ghi nhớ), mỗi đoạn 4 chỗ trống. Trong mỗi đoạn có <b>1 câu điền cả câu</b> (chọn câu phù hợp nhất để chèn vào đoạn).</p>
<h4>3 dạng câu hỏi</h4><ul class="plain">
<li><b>Từ loại / ngữ pháp</b> — làm như Part 5, nhưng <b>thì của động từ phụ thuộc cả đoạn</b> (ví dụ đoạn nói sự kiện "next year" → chọn will begin).</li>
<li><b>Từ nối</b> (However, Therefore, Otherwise, In addition…) → đọc câu trước và câu sau để biết quan hệ: tương phản, kết quả, bổ sung, điều kiện.</li>
<li><b>Chèn câu</b> → khó nhất, để làm cuối cùng trong đoạn.</li></ul>
<h4>Cách làm từng bước</h4><ol>
<li>Đọc <b>tiêu đề và câu đầu</b> để biết loại văn bản và mục đích.</li>
<li>Đọc đoạn văn <b>tuần tự</b>, gặp chỗ trống nào làm chỗ đó (trừ câu chèn).</li>
<li>Câu chèn: đọc kỹ <b>câu ngay trước và ngay sau</b> chỗ trống. Câu đúng phải nối được cả hai: có từ tham chiếu (this, these, it, such), cùng chủ đề, đúng logic thời gian.</li>
<li>Loại đáp án nói về chủ đề "lạc đề" dù đúng ngữ pháp (Our company was founded in 1998.).</li></ol>
<h4>Ví dụ phân tích câu chèn</h4><div class="ex"><p>"You can pick up the car at our airport location, which is open 24 hours a day. ___ Please note that the car must be returned with a full tank of gas."</p>
<p>(A) <b>Simply show your driver's license and credit card at the counter.</b> → nối tiếp ý "nhận xe" ✔<br>(B) Our company was founded in 1998. → lạc đề<br>(C) Compact cars are popular among families. → không liên quan khách hàng này<br>(D) Thank you for your recent payment. → sai vị trí logic</p></div>
<h4>Xu hướng 2026</h4><p>Câu hỏi thì/từ nối "phải đọc cả đoạn mới làm được" tăng lên; câu chèn hay dùng từ tham chiếu như <i>these, this change, such requests</i>. Đừng làm Part 6 như Part 5.</p>
<h4>Mục tiêu cho 600–650</h4><p>10–12/16 trong <b>≤ 10 phút</b> (≈ 2,5 phút/đoạn).</p>`},

{p:"Part 7", t:"Đọc hiểu (54 câu)", c:`
<h4>Đề cho gì</h4><ul class="plain"><li><b>Đoạn đơn:</b> 10 bài, 29 câu (mỗi bài 2–4 câu). Gồm quảng cáo, e-mail, thông báo, bài báo, form, <b>chuỗi tin nhắn 2 người</b> và <b>chat nhóm</b>.</li><li><b>Đoạn kép:</b> 2 bộ × 5 câu.</li><li><b>Đoạn ba:</b> 3 bộ × 5 câu.</li></ul>
<h4>Các dạng câu hỏi</h4><table class="gt"><tr><th>Dạng</th><th>Ví dụ</th><th>Cách làm</th></tr>
<tr><td>Mục đích / chủ đề</td><td>Why was the e-mail sent?</td><td>Đọc tiêu đề + 2 câu đầu</td></tr>
<tr><td>Chi tiết</td><td>When will the tour begin?</td><td>Lấy từ khóa (tên, số, ngày) → dò (scan) trong bài</td></tr>
<tr><td>NOT / true</td><td>What is NOT mentioned?</td><td>Đối chiếu từng đáp án, loại 3 cái có trong bài</td></tr>
<tr><td>Suy luận</td><td>What is suggested / indicated about…?</td><td>Đáp án không có nguyên văn, cần hiểu ngầm</td></tr>
<tr><td>Hàm ý tin nhắn</td><td>At 10:16, what does X mean when he writes "Already done"?</td><td>Đọc tin nhắn <b>ngay trước</b> câu đó</td></tr>
<tr><td>Chèn câu [1]–[4]</td><td>…does the following sentence best belong?</td><td>Tìm từ nối/tham chiếu trong câu cho sẵn</td></tr>
<tr><td>Từ đồng nghĩa</td><td>The word "cover" in line 3 is closest in meaning to</td><td>Thay từng đáp án vào câu, chọn nghĩa hợp ngữ cảnh</td></tr>
<tr><td>Nối thông tin (đoạn kép/ba)</td><td>How much did Ms. Kim's desks cost?</td><td>Lấy dữ kiện ở văn bản này, tra ở văn bản kia</td></tr></table>
<h4>Cách làm từng bước</h4><ol>
<li><b>Đọc câu hỏi trước</b>, gạch từ khóa. Đoán loại thông tin cần tìm (số, tên, lý do).</li>
<li>Đọc lướt bài để nắm bố cục: ai viết cho ai, về việc gì.</li>
<li>Với mỗi câu hỏi, <b>dò đúng vùng</b> chứa từ khóa, đọc kỹ 2–3 câu quanh đó.</li>
<li>Chọn đáp án là <b>phiên bản paraphrase</b> của thông tin trong bài. Đáp án lặp nguyên văn nhiều từ nhất thường là bẫy.</li>
<li>Đoạn kép/ba: <b>mỗi bộ luôn có 1–2 câu phải kết hợp 2 văn bản</b>. Nếu câu hỏi có tên người + con số/ngày tháng, gần như chắc chắn là câu nối.</li></ol>
<h4>Ví dụ câu nối thông tin</h4><div class="ex"><p>Văn bản 1 (bảng giá): Standing desk: $480. Assembly: $30/item. Free delivery over $500.<br>Văn bản 2 (e-mail): "I ordered three standing desks… please add assembly for all three."<br>Q: How much will Ms. Kim pay for assembly? → 3 × $30 = <b>$90</b>.<br>Q: What is indicated about her order? → 3 × $480 = $1,440 &gt; $500 → <b>It qualifies for free delivery.</b></p></div>
<h4>Quản lý thời gian (rất quan trọng)</h4><p>Part 7 cần <b>khoảng 50–55 phút</b>. Nếu bạn làm Part 5 + 6 quá 22 phút, bạn sẽ không kịp. Quy tắc: <b>không quá 1 phút/câu</b>. Câu nào quá 1,5 phút → đoán, đánh dấu, đi tiếp, còn thời gian thì quay lại. Với 600–650, làm chắc đoạn đơn và đoạn kép quan trọng hơn cố làm hết đoạn ba.</p>
<h4>Xu hướng 2026</h4><ul class="plain"><li>Nhiều chat nhóm 3–4 người với câu hàm ý ("Count me in", "That's tight", "Leave it with me").</li><li>Bảng biểu, lịch trình, hóa đơn trong đoạn kép/ba để hỏi <b>tính toán đơn giản</b>.</li><li>Văn bản dài hơn, nhiều câu suy luận "suggested/indicated".</li></ul>
<h4>Mục tiêu cho 600–650</h4><p>30–35/54.</p>`}
];

["Đoạn ba: Thông báo + Lịch + E-mail","<b>Westlake Public Library: Free Technology Workshops for Adults</b><br>This spring, the library is offering a series of free workshops to help residents build their digital skills. All workshops take place in the Computer Lab on the second floor, which has 16 workstations. Because space is limited, registration is required and can be completed online or at the information desk. Participants who register but cannot attend are asked to cancel at least 24 hours in advance so that people on the waiting list can take their place. Library card holders may also borrow laptops for use during the workshops.<hr><b>Workshop Schedule</b><table><tr><th>Date</th><th>Time</th><th>Topic</th><th>Instructor</th></tr><tr><td>April 3 (Thu)</td><td>10:00–11:30 A.M.</td><td>Getting Started with E-mail</td><td>Tom Reyes</td></tr><tr><td>April 10 (Thu)</td><td>10:00–11:30 A.M.</td><td>Online Banking Safety</td><td>Grace Ellis</td></tr><tr><td>April 15 (Tue)</td><td>6:00–7:30 P.M.</td><td>Creating a Résumé</td><td>Tom Reyes</td></tr><tr><td>April 22 (Tue)</td><td>6:00–7:30 P.M.</td><td>Video Calls with Family and Friends</td><td>Mina Park</td></tr><tr><td>April 29 (Tue)</td><td>6:00–7:30 P.M.</td><td>Introduction to Spreadsheets</td><td>Grace Ellis</td></tr></table><hr>To: info@westlakelibrary.org<br>From: Samuel Ortega<br>Date: April 13<br>Subject: Workshop registration<br><br>Hello,<br>I registered for the résumé workshop, but I have just been offered a job interview at the same time. Could you please remove me from the list so that someone else can attend? I am sorry for the short notice.<br>I also wanted to say how helpful I found Ms. Ellis's workshop last week. I now feel much more confident about managing my accounts online. I would like to attend her next session as well, if there is still space. I do not have a computer at home, so I will need to borrow one.<br>Thank you,<br>Samuel Ortega",

["Đoạn ba: Quảng cáo + Đơn đặt hàng + E-mail","<b>FreshFleet Office Lunch Delivery</b><br>Keep your team happy and productive with healthy, delicious lunches delivered right to your office. Order by 10 A.M. for delivery between 12:00 and 12:30 P.M. the same day.<br>• Classic Box (sandwich, salad, fruit): $11 per person<br>• Hot Meal Box (main dish, rice or bread, dessert): $14 per person<br>• Vegan Box: $13 per person<br>Minimum order: 10 boxes. Orders of 30 boxes or more receive free delivery; otherwise, a $15 delivery fee applies. Standing weekly orders receive an additional 5% discount.<hr><b>FreshFleet Order Confirmation #7712</b><br>Customer: Carla Jensen, Nordstrand Engineering<br>Delivery date: Wednesday, October 8<br>Items: Hot Meal Box × 20; Vegan Box × 6<br>Delivery fee: $15.00<br>Total: $373.00<br>Delivery address: 400 Pine Street, 7th floor reception<br>Special instructions: Please call Ms. Jensen on arrival (555-0133).<hr>To: orders@freshfleet.com<br>From: Carla Jensen<br>Date: October 6<br>Subject: Order #7712<br><br>Hello,<br>I placed order #7712 this morning for Wednesday. I have just learned that four more colleagues from our Oslo office will be joining the meeting, so I would like to increase the number of Hot Meal Boxes accordingly. Could you please update the order and send me a revised total?<br>Also, if everything goes well, we are thinking of setting up a standing order for every Wednesday starting next month. Could you send me information about how that works?<br>Best regards,<br>Carla Jensen",

["Đoạn ba: Bài báo + E-mail + Lịch","<b>Port City Food Festival Returns</b><br>(August 2) — The Port City Food Festival will return to Waterfront Park from August 22 to 24, featuring more than 70 food stalls, cooking demonstrations, and live music. This year's festival will also include a new \"Taste of the World\" area, where local restaurants will offer dishes from more than 20 countries.<br>Admission is free, but visitors must purchase tokens to buy food and drinks. Tokens cost $2 each and can be bought at booths near each entrance. Organizers recommend using public transportation, as parking near the park will be extremely limited. Extra buses will run from Central Station every ten minutes during the festival.<br>Chef Marco Bellini, whose restaurant Bellini's won last year's Best Dish award, will lead a cooking demonstration on the final day of the festival.<hr>To: Festival Volunteers<br>From: Joanne Pratt, Volunteer Coordinator<br>Date: August 15<br>Subject: Your assignments<br><br>Dear volunteers,<br>Thank you for signing up to help at this year's festival. Your shift assignments are shown in the attached schedule. Please arrive 15 minutes before your shift starts and check in at the volunteer tent near the north entrance, where you will receive your T-shirt and badge. Volunteers who work two or more shifts will receive a pass for free food tokens worth $20.<br>If you need to change your shift, please contact me by August 19.<br>Joanne<hr><b>Volunteer Schedule (excerpt)</b><table><tr><th>Name</th><th>Date</th><th>Shift</th><th>Assignment</th></tr><tr><td>Kevin Tran</td><td>Aug 22</td><td>10 A.M.–2 P.M.</td><td>Token booth, south entrance</td></tr><tr><td>Kevin Tran</td><td>Aug 24</td><td>2 P.M.–6 P.M.</td><td>Demonstration stage</td></tr><tr><td>Rita Singh</td><td>Aug 23</td><td>4 P.M.–8 P.M.</td><td>Information booth</td></tr><tr><td>Leo Park</td><td>Aug 24</td><td>10 A.M.–2 P.M.</td><td>Recycling stations</td></tr></table>",
["What is new at this year's festival?","A section with international food","Live music performances","Cooking demonstrations","Free admission"],
["What are visitors encouraged to do?","Take public transportation","Buy tokens online","Arrive early in the morning","Park at Central Station"],
["Where should volunteers go when they arrive?","To a tent near the north entrance","To the south entrance","To the demonstration stage","To Central Station"],

["Đoạn ba: E-mail + E-mail + Biểu mẫu","To: Daniel Ross, Facilities<br>From: Priya Nair, Research &amp; Development<br>Date: January 9<br>Subject: Laboratory temperature<br><br>Hi Daniel,<br>For the past two weeks, the temperature in Lab 3 has been too high in the afternoons, sometimes reaching 27°C. Several of our experiments must be carried out between 18°C and 22°C, so we have had to postpone some of them. I suspect the problem is related to the new equipment we installed in December, which gives off a lot of heat.<br>Could someone look at the air-conditioning system this week? We have an important series of tests scheduled to begin on January 20.<br>Thanks,<br>Priya<hr>To: Priya Nair<br>From: Daniel Ross<br>Date: January 10<br>Subject: RE: Laboratory temperature<br><br>Hi Priya,<br>Thanks for letting me know. Our technician, Hugo Bell, inspected the system this morning. The unit serving Lab 3 is working correctly, but it was designed for the room's previous use as an office and does not have enough capacity for your current equipment. We can install an additional cooling unit, but it will take about ten days to order and install. In the meantime, Hugo will set up two portable air conditioners in the lab this afternoon. Please fill out the attached request form so that the cost can be charged to your department's budget.<br>Daniel<hr><b>Facilities Work Request</b><br>Requested by: Priya Nair · Department: R&amp;D · Budget code: RD-2204<br>Location: Lab 3<br>Work requested: Installation of additional cooling unit<br>Required completion date: <u>January 19</u><br>Approved by: M. Oduya, R&amp;D Director<br>Date: January 10",

["Đoạn ba: Trang web + Đánh giá + Phản hồi","<b>Alpine Rest Hotel: Rooms and Rates</b><br><b>Standard Room</b> (queen bed, garden view): $140/night<br><b>Deluxe Room</b> (king bed, mountain view, balcony): $190/night<br><b>Family Suite</b> (two bedrooms, kitchenette, mountain view): $260/night<br>All rates include breakfast and use of the indoor pool. Guests staying three nights or more receive a free guided hike. Free shuttle service to the Summit Ski Resort runs every hour from 7 A.M. to 6 P.M. during the winter season (December–March).<hr>★★★☆☆ Reviewed by Helena Brandt, February 16<br>My husband and I stayed at the Alpine Rest for three nights with our two children. The suite was spacious, and being able to make simple meals in our room saved us a lot of money. The view of the mountains from the living room was breathtaking. However, we were disappointed that the pool was closed for maintenance for two of the three days, and no one had informed us when we booked. Also, the free hike we had been promised was canceled because of a shortage of guides, and we were not offered anything in its place. The breakfast was excellent, and the staff at the front desk were very friendly.<hr><b>Response from the hotel manager, February 18</b><br>Dear Ms. Brandt,<br>Thank you for your review. I sincerely apologize that the pool was unavailable during much of your stay and that you were not informed in advance. We have changed our procedures so that guests are now notified by e-mail of any planned maintenance. Regarding the guided hike, we have since hired two additional guides to prevent this from happening again. I would like to offer you a complimentary night in the same type of room on your next visit. Please contact me directly to arrange it.<br>Oliver Stein, General Manager",

["Trích đoạn cuộc họp","Before we finish, I want to talk about the results of our customer survey. Overall, customers are happy with our products. Over 80 percent said they would recommend us to a friend. But many of them said that our website is difficult to use, especially on mobile phones. Now, I know we just redesigned it last year. But customers are telling us they can't find basic information, like delivery times and return policies. So I've asked an outside company that specializes in mobile design to review the site and make recommendations. They'll present their findings at our meeting next month, and we'll decide then how much of the budget to spend on changes.",

const AUD = []; const addAud = segs => (AUD.push(segs), AUD.length - 1);

/* ========== question blocks ========== */
const blankify = s => '<span class="en">' + esc(s).replace(/___/g, '<span class="blank"></span>') + '</span>';
const gBlock = (gi, qi) => { const q = GRAMMAR[gi].q[qi]; return {tag:'Ngữ pháp', qs:[{p:blankify(q[0]), o:q[1], a:q[2], e:q[3]}]}; };
const p5Block = i => { const q = P5[i]; return {tag:'Part 5', qs:[{p:blankify(q[0]), o:q[1], a:q[2], e:q[3]}]}; };
const p1Block = i => { const x = P1[i]; return {tag:'Part 1', head:`<div class="scene"><span class="cam">Ảnh</span>${esc(x.s)}</div>`,
  audio: x.o.map((o, j) => ({t: 'ABCD'[j] + '. ' + o, v:'N', p:900})),

const p2Block = i => { const x = P2[i]; return {tag:'Part 2',

  qs:[{p:'Nghe câu hỏi và chọn câu trả lời phù hợp nhất.', o:x[1], a:x[2], hide:true, e:x[3]}]}; };
const convBlock = (x, tag) => ({tag, head: tag === 'Part 4' ? `<div class="scene"><span class="cam">Loại bài</span>${esc(x.k)}</div>` : '',
  audio: x.l ? x.l.map(l => ({t:l[1], v:l[0], p:500})) : [{t:x.t, v:'N'}],
  tr: x.l ? x.l.map(l => `<b>${l[0] === 'W' ? 'Woman' : 'Man'}:</b> ${esc(l[1])}`).join('<br>') : esc(x.t),
  qs: x.q.map(q => ({p:`<span class="en">${esc(q[0])}</span>`, o:q[1], a:q[2]}))});
const p3Block = i => convBlock(P3[i], 'Part 3');
const p4Block = i => convBlock(P4[i], 'Part 4');
const p6Block = i => { const x = P6[i]; return {tag:'Part 6', head:`<div class="passage"><h5>${esc(x.title)}</h5><div class="en">${x.text.replace(/\[(\d)\]/g, '<span class="gap">$1</span>')}</div></div>`,
  qs: x.q.map((q, j) => ({p:`Chỗ trống số ${j+1}`, o:q[0], a:q[1], e:q[2]}))}; };
const p7Block = i => { const x = P7[i]; return {tag:'Part 7', head:`<div class="passage"><h5>${esc(x.title)}</h5><div class="en">${x.text}</div></div>`,
  qs: x.q.map(q => ({p:`<span class="en">${esc(q[0])}</span>`, o:q[1], a:q[2]}))}; };

function vocabBlocks(words, n, r, mode){
  return pick(words, Math.min(n, words.length), r).map(w => {
    let pool = ALLW.filter(x => x.ti === w.ti && x.w !== w.w); if (pool.length < 3) pool = ALLW.filter(x => x.w !== w.w);
    const ds = pick(pool, 3, r); const opts = shuffle([w, ...ds], r); const a = opts.indexOf(w);
    if (mode === 'vi') return {tag:'Từ vựng', qs:[{p:`Từ nào có nghĩa “${esc(w.vi)}”?`, o:opts.map(x => x.w), a, e:`${w.w} (${w.pos}) — ${w.ex}`}]};
    if (mode === 'ctx') {
      const re = new RegExp(w.w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i');
      if (re.test(w.ex)) return {tag:'Từ vựng', qs:[{p:blankify(w.ex.replace(re, '___')), o:opts.map(x => x.w), a, e:`${w.w}: ${w.vi}`}]};
    }
    return {tag:'Từ vựng', qs:[{p:`<span class="en">${esc(w.w)}</span> <i>(${w.pos})</i> nghĩa là gì?`, o:opts.map(x => x.vi), a, e:`Ví dụ: ${w.ex}`}]};
  });
}
function mixedGrammar(n, r, gis){ const pool = ALLG.filter(x => !gis || gis.includes(x.gi)); return pick(pool, n, r).map(x => gBlock(x.gi, GRAMMAR[x.gi].q.indexOf(x.q))); }

/* ========== quiz renderer ========== */
const SETS = {}; let setSeq = 0;
function quizHTML(blocks, key, opt = {}){
  const id = 'set' + (setSeq++); SETS[id] = {blocks, key, opt};
  return `<div class="qset" id="${id}">${quizInner(id)}</div>`;
}
function quizInner(id){
  const {blocks, opt} = SETS[id]; let n = opt.start || 0, h = '';
  blocks.forEach((b, bi) => {
    if (b.pre) h += b.pre;
    h += `<div class="blk" id="${id}_b${bi}">`;
    if (b.tag) h += `<div class="tag">${b.tag}</div>`;
    if (b.head) h += b.head;
    if (b.audio) h += `<button class="play" data-aud="${addAud(b.audio)}" data-label="▶ Phát audio">▶ Phát audio</button>`;
    b.qs.forEach((q, qi) => {
      n++;
      h += `<fieldset class="q" data-b="${bi}" data-q="${qi}"><legend><span class="qn">${n}</span>${q.p}</legend><div class="opts">`;
      q.o.forEach((o, oi) => {
        h += `<label class="opt"><input type="radio" name="${id}_${bi}_${qi}" value="${oi}"><span class="L">${'ABCD'[oi]}</span><span class="ot${q.hide ? ' hid' : ''}">${esc(o)}</span></label>`;
      });
      h += `</div><div class="exp" hidden></div></fieldset>`;
    });
    if (b.tr) h += `<details class="tr" hidden><summary>Xem transcript</summary><div class="en">${b.tr}</div></details>`;
    h += `</div>`;
  });
  h += `<div class="qfoot"><button class="btn primary" data-grade="${id}">Chấm điểm</button><span class="res"></span></div>`;
  return h;
}
function grade(id){
  const set = SETS[id]; const root = document.getElementById(id); let c = 0, t = 0; const wrong = [], det = [];
  $$('fieldset.q', root).forEach(fs => {
    const b = set.blocks[+fs.dataset.b], q = b.qs[+fs.dataset.q]; t++;
    const sel = $('input:checked', fs); const v = sel ? +sel.value : -1;
    $$('.opt', fs).forEach((l, i) => { l.classList.toggle('right', i === q.a); l.classList.toggle('wrong', i === v && v !== q.a); $('input', l).disabled = true; });
    $$('.ot.hid', fs).forEach(x => x.classList.remove('hid'));
    const ok = v === q.a; if (ok) c++; else if (!set.opt.mp || set.opt.mp.includes(b.tag)) wrong.push({b, q});
    det.push({bi: +fs.dataset.b, qi: +fs.dataset.q, ok, part: b.part});
    fs.classList.add(ok ? 'is-right' : 'is-wrong');
    const e = $('.exp', fs); e.hidden = false;
    e.innerHTML = (ok ? '<b class="g">Đúng.</b> ' : `<b class="r">Sai${v < 0 ? ' (bỏ trống)' : ''}.</b> Đáp án: ${'ABCD'[q.a]}. `) + (q.e ? esc(q.e) : '');
  });
  $$('details.tr', root).forEach(d => d.hidden = false); root.classList.add('graded'); $$('.play.used', root).forEach(b => { b.classList.remove('used'); b.textContent = b.dataset.label; });
  if (set.key !== 'mistakes') {
    wrong.forEach(({b, q}) => {
      const sig = q.p + '|' + q.o.join('|');
      if (!S.mistakes.some(m => m.sig === sig)) S.mistakes.push({sig, at: Date.now(), b:{tag:b.tag, head:b.head, audio:b.audio, tr:b.tr, qs:[q]}});
    });
  }
  const prev = S.scores[set.key]; const pct = Math.round(c / t * 100);
  S.scores[set.key] = {c, t, pct, best: Math.max(pct, prev ? prev.best : 0), at: Date.now()};
  save();
  const res = $('.res', root);
  res.innerHTML = `<b>${c}/${t}</b> câu đúng (${pct}%)` + (wrong.length && set.key !== 'mistakes' ? ` · ${wrong.length} câu sai đã lưu vào Sổ lỗi sai` : '');
  const btn = $('[data-grade]', root); btn.textContent = 'Làm lại'; btn.dataset.redo = '1';
  if (set.opt.task) mark(set.opt.task[0], set.opt.task[1]);
  if (set.opt.after) set.opt.after(c, t, det);
  TTS.stop();
}
